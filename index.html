<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>國一闖關王</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="國一闖關王">
<meta name="theme-color" content="#f6f1e7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  color-scheme: light;
  --bg: #f6f1e7;
  --card: #ffffff;
  --ink: #2b2a33;
  --muted: #7a7684;
  --line: #e7e1d4;
  --brand: #6c4ee0;
  --brand-dark: #4b33b0;
  --brand-soft: #efeafe;
  --ok: #22a06b;
  --ok-soft: #e3f6ec;
  --bad: #e5484d;
  --bad-soft: #fde8e8;
  --gold: #f5a524;
  --geo: #2e9e6b;
  --his: #e07a2e;
  --civ: #3a7bd5;
  --bio: #12917f;
  --radius: 18px;
  --shadow: 0 2px 0 rgba(0,0,0,.06), 0 6px 18px rgba(60,40,10,.06);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 18px; line-height: 1.5;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height: 100vh;
}
#app { max-width: 820px; margin: 0 auto; padding: 16px 16px 40px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
mark { background: linear-gradient(transparent 45%, #ffe27a 45%); color: inherit; font-weight: 700; padding: 0 1px; }

/* 共用 */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.big-btn {
  display: block; width: 100%; padding: 18px; border-radius: 16px;
  background: var(--brand); color: #fff; font-size: 21px; font-weight: 700;
  box-shadow: 0 4px 0 var(--brand-dark); transition: transform .08s;
}
.big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-dark); }
.big-btn.green { background: var(--ok); box-shadow: 0 4px 0 #17784f; }
.big-btn.gold { background: var(--gold); box-shadow: 0 4px 0 #c47f0c; color: #3a2600; }
.big-btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.big-btn:disabled { opacity: .5; }
.top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.back { font-size: 17px; padding: 8px 14px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; }
.chip.geo { background: var(--geo); } .chip.his { background: var(--his); } .chip.civ { background: var(--civ); } .chip.bio { background: var(--bio); }
.go-btn { padding: 10px 18px; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 700; font-size: 17px; white-space: nowrap; box-shadow: 0 3px 0 var(--brand-dark); }
.go-btn:disabled { background: var(--line); color: var(--muted); box-shadow: none; }
.btn-sm { display: inline-block; padding: 10px 16px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 16px; }
.btn-sm.danger { background: var(--bad-soft); color: var(--bad); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }

/* 首頁 */
.hero { display: flex; gap: 14px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 20px; background: var(--brand-soft); display: grid; place-items: center; font-size: 38px; flex: none; }
.hero-main { flex: 1; min-width: 0; }
.title-line { font-size: 22px; font-weight: 800; }
.xpbar { height: 12px; border-radius: 99px; background: var(--brand-soft); overflow: hidden; margin-top: 6px; }
.xpbar > div { height: 100%; background: var(--brand); border-radius: 99px; transition: width .5s; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat { background: var(--bg); border-radius: 14px; padding: 10px; text-align: center; }
.stats.loose .stat { background: var(--card); box-shadow: var(--shadow); }
.stat b { display: block; font-size: 24px; }
.stat span { font-size: 14px; color: var(--muted); }
.task { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.task:last-of-type { border-bottom: 0; }
.task-main { flex: 1; min-width: 0; }
.task-name { font-weight: 700; }
.check { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-size: 20px; flex: none; color: #fff; }
.check.on { background: var(--ok); border-color: var(--ok); }
.done-tag { color: var(--ok); font-weight: 700; font-size: 16px; white-space: nowrap; }
.week-dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.wd { text-align: center; font-size: 14px; color: var(--muted); }
.wd span { display: grid; place-items: center; height: 40px; border-radius: 12px; background: var(--bg); margin-bottom: 3px; font-size: 22px; }
.wd.on span { background: #ffe9c7; }
.wd.today span { outline: 3px solid var(--brand); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 14px; text-align: center; font-weight: 700; font-size: 19px; position: relative; }
.tile .ico { font-size: 36px; display: block; margin-bottom: 4px; }
.badge { position: absolute; top: 10px; right: 12px; background: var(--bad); color: #fff; font-size: 14px; border-radius: 99px; padding: 1px 9px; }
.badge.gold-badge { background: var(--gold); color: #3a2600; }
.rest { text-align: center; padding: 6px 0 2px; font-size: 17px; }

/* 分頁 */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--card); padding: 6px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.tabs button { padding: 12px; border-radius: 12px; font-weight: 700; font-size: 18px; color: var(--muted); }
.tabs button.on { background: var(--brand); color: #fff; }

/* 答題 */
.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.qbar { flex: 1; height: 14px; background: var(--card); border-radius: 99px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line); }
.qbar > div { height: 100%; background: var(--ok); transition: width .3s; }
.combo { font-weight: 800; color: var(--his); min-width: 70px; text-align: right; }
.question { font-size: 23px; font-weight: 700; margin: 10px 0 4px; }
.opts { display: grid; gap: 12px; margin-top: 16px; }
.opt { text-align: left; width: 100%; padding: 16px 18px; border-radius: 16px; background: var(--card); border: 3px solid var(--line); font-size: 20px; box-shadow: 0 3px 0 var(--line); }
.opt:active:not(:disabled) { transform: translateY(2px); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.opt.dim { opacity: .5; }
.feedback { border-radius: 16px; padding: 16px; margin-top: 16px; font-size: 18px; animation: pop .25s ease-out; }
.feedback.ok { background: var(--ok-soft); border: 2px solid var(--ok); }
.feedback.bad { background: var(--bad-soft); border: 2px solid var(--bad); }
.feedback h3 { font-size: 21px; margin-bottom: 6px; }
.slots { display: grid; gap: 8px; margin-top: 14px; }
.slot { min-height: 54px; border-radius: 14px; border: 3px dashed var(--line); display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 19px; background: rgba(255,255,255,.5); text-align: left; }
.slot.filled { border-style: solid; background: var(--card); border-color: var(--brand); }
.slot .n { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; flex: none; font-size: 16px; }
.slot.right { border-color: var(--ok); background: var(--ok-soft); }
.slot.wrong { border-color: var(--bad); background: var(--bad-soft); }
.pool { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.pool .opt { width: auto; padding: 12px 16px; font-size: 18px; }

/* 結算 */
.result { text-align: center; }
.result .emoji { font-size: 72px; }
.result .score { font-size: 46px; font-weight: 900; }
.gains { display: flex; justify-content: center; gap: 12px; margin: 14px 0; flex-wrap: wrap; }
.gain { background: var(--bg); padding: 8px 16px; border-radius: 99px; font-weight: 700; }

/* 練習選單、錯題本、筆記列表 */
.subj-h { display: flex; align-items: center; gap: 8px; font-size: 21px; font-weight: 800; margin-bottom: 6px; }
.ch-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--bg); margin-top: 8px; font-size: 18px; text-align: left; }
.ch-btn .meta { font-size: 14px; color: var(--muted); white-space: nowrap; }
.exam-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; vertical-align: 2px; }
.exam-tag.e1 { background: #e6f0ff; color: #2d5fb8; } .exam-tag.e2 { background: #ffeede; color: #b5560f; } .exam-tag.e3 { background: #eae6ff; color: #5a3fc0; }
.stars { color: var(--gold); letter-spacing: 1px; }
.bk { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.bk:last-child { border-bottom: 0; }
.dots { letter-spacing: 2px; color: var(--ok); }

/* 重點筆記 */
.note { -webkit-user-select: text; user-select: text; }
.goal { background: var(--brand-soft); border-radius: 12px; padding: 10px 14px; font-size: 17px; }
.note-block { margin-top: 16px; }
.note-block h3 { font-size: 19px; color: var(--brand-dark); border-left: 5px solid var(--brand); padding-left: 10px; }
.note-block ul { margin: 8px 0 0; padding-left: 22px; }
.note-block li { margin: 6px 0; }
.note-box { border-radius: 14px; padding: 12px 14px; margin-top: 14px; }
.note-box b { display: block; margin-bottom: 4px; }
.note-box.tip { background: #fff8db; border: 2px dashed #f0c341; }
.note-box.trap { background: var(--bad-soft); border-left: 5px solid var(--bad); }
.note-box.exam { background: #f2e9fb; border-left: 5px solid #8e44c9; }
.modal { position: fixed; inset: 0; background: rgba(30,20,10,.45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: calc(16px + env(safe-area-inset-top)) 16px 16px; overflow-y: auto; animation: pop .2s; }
.modal-card { background: var(--card); border-radius: var(--radius); padding: 18px; max-width: 780px; width: 100%; }

/* 商店 */
.coin-big { font-size: 40px; font-weight: 900; margin: 4px 0; }
.shop-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.shop-row:last-child { border-bottom: 0; }
.shop-ico { font-size: 30px; width: 44px; text-align: center; flex: none; }
.pending { color: #b5560f; font-weight: 700; }

/* 家長 */
.pin-dots { display: flex; justify-content: center; gap: 16px; margin: 18px 0; }
.pin-dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--brand); }
.pin-dots i.on { background: var(--brand); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 0 auto; }
.keypad button { padding: 16px 0; font-size: 26px; font-weight: 700; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 14px; }
td.num, th.num { text-align: right; white-space: nowrap; }
.acc { display: inline-block; min-width: 52px; text-align: center; border-radius: 8px; padding: 1px 6px; font-weight: 700; }
.week { display: flex; align-items: flex-end; gap: 8px; height: 110px; margin-top: 10px; }
.week .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 13px; color: var(--muted); }
.week .bar { width: 100%; max-width: 34px; background: var(--brand); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.week .v { font-size: 13px; color: var(--ink); }
.range-subj { font-weight: 800; margin-top: 12px; }
.check-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 17px; }
.check-row input { width: 24px; height: 24px; accent-color: var(--brand); flex: none; }
input[type=text], input[type=tel] { font: inherit; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); width: 140px; -webkit-user-select: text; user-select: text; }
.edit-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.edit-row .ico-in { width: 56px; text-align: center; }
.edit-row .name-in { flex: 1; min-width: 0; width: auto; }
.edit-row .cost-in { width: 84px; }

/* 動畫 */
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.shake { animation: shake .3s; }
.burst { position: fixed; pointer-events: none; font-size: 30px; z-index: 50; animation: fly 1.2s ease-out forwards; }
@keyframes fly { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; z-index: 60; font-size: 17px; animation: pop .2s; max-width: 90vw; text-align: center; }

@media (max-width: 520px) {
  body { font-size: 17px; }
  .question { font-size: 21px; }
  .opt { font-size: 18px; }
  .ch-btn { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="chapters.js"></script>
<script src="questions.js"></script>
<script src="pet.js"></script>
<script src="app.js"></script>
</body>
</html>
